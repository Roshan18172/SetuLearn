<svg width="1920" height="900" viewBox="0 0 1920 900" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <pattern id="dotGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="3" fill="#C9BEF0"/>
    </pattern>

    <pattern id="dotGridOrange" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2.5" fill="#F5A623" opacity="0.8"/>
    </pattern>
  </defs>

  <!-- ============ BOTTOM-LEFT MAIN RING CLUSTER ============ -->
  <g opacity="0.9">
    <circle cx="10" cy="700" r="280" fill="none" stroke="#D9CFF2" stroke-width="65"/>
    <circle cx="10" cy="700" r="375" fill="none" stroke="#C9BAF0" stroke-width="1.5" stroke-dasharray="4 8"/>
    <circle cx="55" cy="640" r="150" fill="none" stroke="#E3DBF7" stroke-width="10"/>
  </g>

  <!-- Small ring with center dot -->
  <g transform="translate(430,790)">
    <circle r="26" fill="none" stroke="#C9BAF0" stroke-width="6"/>
    <circle r="7" fill="#C9BAF0"/>
  </g>

  <!-- Dot grid cluster - lower left -->
  <g transform="translate(280,830)">
    <rect width="110" height="65" fill="url(#dotGrid)"/>
  </g>

  <!-- Dashed decorative circle - lower left, faint -->
  <circle cx="160" cy="560" r="115" fill="none" stroke="#D9CFF2" stroke-width="1.5" stroke-dasharray="3 7" opacity="0.7"/>

  <!-- Small orange dot row -->
  <g transform="translate(280,865)" fill="#F5A623" opacity="0.85">
    <circle cx="0" cy="0" r="4"/>
    <circle cx="16" cy="0" r="4"/>
    <circle cx="32" cy="0" r="4"/>
  </g>

  <!-- ============ TOP-LEFT SECONDARY RING (random placement) ============ -->
  <g opacity="0.6">
    <circle cx="130" cy="70" r="90" fill="none" stroke="#D9CFF2" stroke-width="22"/>
    <circle cx="130" cy="70" r="130" fill="none" stroke="#C9BAF0" stroke-width="1.5" stroke-dasharray="3 6"/>
  </g>
  <g transform="translate(230,190)">
    <rect width="70" height="46" fill="url(#dotGrid)" opacity="0.7"/>
  </g>

  <!-- ============ MID-CANVAS FAINT RING (behind hero text area, subtle) ============ -->
  <circle cx="640" cy="470" r="230" fill="none" stroke="#E3DBF7" stroke-width="1.5" stroke-dasharray="2 8" opacity="0.45"/>
  <circle cx="750" cy="820" r="15" fill="#C9BAF0" opacity="0.5"/>

  <!-- ============ TOP-RIGHT DECORATIVE CLUSTER ============ -->

  <!-- Extra ring cluster, top right corner, partly off-canvas -->
  <g opacity="0.7">
    <circle cx="1910" cy="40" r="150" fill="none" stroke="#D9CFF2" stroke-width="34"/>
    <circle cx="1910" cy="40" r="200" fill="none" stroke="#C9BAF0" stroke-width="1.5" stroke-dasharray="4 8"/>
  </g>

  <!-- Dot grid near top, above card cluster -->
  <g transform="translate(1360,90)">
    <rect width="85" height="56" fill="url(#dotGrid)"/>
  </g>

  <circle cx="1355" cy="118" r="7" fill="#8B6FE8"/>

  <!-- Circle badge with arrow icon -->
  <g transform="translate(1348,225)">
    <circle r="32" fill="#EDE6FB"/>
    <path d="M -8 8 L 8 -8 M -2 -8 L 8 -8 L 8 2" stroke="#8B6FE8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
  <circle cx="1348" cy="225" r="52" fill="none" stroke="#C9BAF0" stroke-width="1.5" stroke-dasharray="3 6" opacity="0.8"/>

  <!-- Sparkles scattered -->
  <g fill="#F5A623">
    <path d="M1855 275
             C1857 283, 1859 285, 1867 287
             C1859 289, 1857 291, 1855 299
             C1853 291, 1851 289, 1843 287
             C1851 285, 1853 283, 1855 275 Z"/>
    <path d="M1815 780
             C1817 788, 1819 790, 1827 792
             C1819 794, 1817 796, 1815 804
             C1813 796, 1811 794, 1803 792
             C1811 790, 1813 788, 1815 780 Z"/>
    <path d="M960 130
             C962 136, 963 137, 969 139
             C963 141, 962 142, 960 148
             C958 142, 957 141, 951 139
             C957 137, 958 136, 960 130 Z" opacity="0.7"/>
  </g>

  <!-- Small purple dot rows near cards -->
  <circle cx="1650" cy="470" r="4" fill="#C9BAF0"/>
  <circle cx="1666" cy="470" r="4" fill="#C9BAF0"/>
  <circle cx="1682" cy="470" r="4" fill="#C9BAF0"/>

  <!-- Bottom-right small dashed ring, random accent -->
  <g opacity="0.6">
    <circle cx="1760" cy="850" r="70" fill="none" stroke="#D9CFF2" stroke-width="16"/>
    <circle cx="1760" cy="850" r="100" fill="none" stroke="#C9BAF0" stroke-width="1.5" stroke-dasharray="3 6"/>
  </g>
  <g transform="translate(1600,760)">
    <rect width="60" height="40" fill="url(#dotGridOrange)" opacity="0.6"/>
  </g>

  <!-- A few loose scattered dots across canvas for texture -->
  <circle cx="900" cy="60" r="5" fill="#C9BAF0" opacity="0.6"/>
  <circle cx="1080" cy="820" r="6" fill="#D9CFF2" opacity="0.6"/>
  <circle cx="500" cy="140" r="4" fill="#C9BAF0" opacity="0.5"/>
  <circle cx="1210" cy="60" r="4" fill="#F5A623" opacity="0.5"/>

</svg>
